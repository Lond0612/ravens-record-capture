[package]
name = "rrcap"
version = "0.1.0"
license = "GPL-3.0-or-later"
description = "Capture a game with libobs and save the last N seconds as a clip (replay buffer), controlled over JSON Lines"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
env_logger = "0.11.11"
libobs = "6.0.0"
libobs-bootstrapper = "0.5.0"
libobs-simple = "9.0.0"
libobs-window-helper = "0.4.1"
libobs-wrapper = "10.0.1"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }

[build-dependencies]
libobs-bootstrapper = "0.5.0"
